# Netlify Configuration for RAAH Career OS

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route API calls to Netlify Functions if deployed
[[redirects]]
  from = "/api/ai/agent"
  to = "/.netlify/functions/agent"
  status = 200

# SPA catch-all redirect (prevents 404 on page refresh for /practice, /quizzes, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for high performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
